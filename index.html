<!DOCTYPE html>
<html lang="en" data-theme="light" data-palette="eye">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>the crIB · Your one-stop study hub</title>
<meta name="description" content="the crIB — finance interview prep: lessons, quizzes and drills following the Red Book.">
<meta name="theme-color" content="#f5f4ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11180c" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="the crIB">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<noscript><div style="max-width:560px;margin:60px auto;padding:24px;font-family:sans-serif;text-align:center">the crIB needs JavaScript turned on.</div></noscript>

<!-- sign-in -->
<div id="auth" hidden>
  <div class="brand"><div class="logo-tile"><svg viewBox="0 0 1000 741" aria-hidden="true"><path fill-rule="evenodd" d="M144 30 C150 90 218 150 288 175 C218 200 150 260 144 320 C138 260 70 200 0 175 C70 150 138 90 144 30 Z M56 741 L56 302 C95 325 125 362 151 415 C177 362 210 322 250 299 L250 741 Z M251 0 L717 0 C850 0 945 85 945 230 C945 300 905 350 842 371 C945 395 1000 470 1000 560 C1000 675 905 741 775 741 L372 741 C336 741 316 718 316 682 L316 300 L680 298 C712 298 734 272 734 237 C734 202 712 175 680 175 L430 175 C352 175 300 120 251 0 Z M441 453 L738 453 C764 453 782 474 782 499 L782 517 C782 543 764 563 738 563 L413 563 C403 563 397 557 397 547 L397 497 C397 472 417 453 441 453 Z"/></svg></div><div><h1 class="brand-name">the cr<b>IB</b></h1><span class="brand-tag">Your one-stop study hub</span></div></div>
  <div class="card">
    <h2 id="auth-title">Sign in</h2>
    <p class="muted" style="font-size:13px;margin:0 0 6px">Your progress syncs to your account, so you can pick up on any device.</p>
    <form id="auth-form" autocomplete="on">
      <div id="auth-name-row" hidden><label class="fld" for="auth-name">Display name</label><input type="text" id="auth-name" autocomplete="nickname" placeholder="What friends will see"></div>
      <label class="fld" for="auth-email">Email</label><input type="text" inputmode="email" id="auth-email" autocomplete="email" autocapitalize="off" spellcheck="false">
      <div id="auth-pass-row"><label class="fld" for="auth-pass">Password</label><input type="password" id="auth-pass" autocomplete="current-password" style="width:100%;border:1px solid var(--line);border-radius:var(--radius-s);padding:10px;font:inherit;font-size:16px;background:var(--panel);color:var(--ink)"></div>
      <button class="btn primary" id="auth-go" type="submit" style="width:100%;margin-top:16px">Sign in</button>
    </form>
    <div id="auth-msg"></div>
    <div class="auth-links">
      <a href="#" class="auth-switch" data-mode="signup">Create an account</a>
      <a href="#" class="auth-switch" data-mode="signin" hidden>I already have an account</a>
      <a href="#" class="auth-switch" data-mode="forgot">Forgot password?</a>
    </div>
  </div>
  <button class="btn guest-btn" id="auth-guest">Continue without an account <span class="muted" style="font-weight:500">(saves on this device only)</span></button>
</div>

<!-- app -->
<div class="wrap" id="app-root" hidden>
  <header>
    <div class="brand">
      <div class="logo-tile"><svg viewBox="0 0 1000 741" aria-hidden="true"><path fill-rule="evenodd" d="M144 30 C150 90 218 150 288 175 C218 200 150 260 144 320 C138 260 70 200 0 175 C70 150 138 90 144 30 Z M56 741 L56 302 C95 325 125 362 151 415 C177 362 210 322 250 299 L250 741 Z M251 0 L717 0 C850 0 945 85 945 230 C945 300 905 350 842 371 C945 395 1000 470 1000 560 C1000 675 905 741 775 741 L372 741 C336 741 316 718 316 682 L316 300 L680 298 C712 298 734 272 734 237 C734 202 712 175 680 175 L430 175 C352 175 300 120 251 0 Z M441 453 L738 453 C764 453 782 474 782 499 L782 517 C782 543 764 563 738 563 L413 563 C403 563 397 557 397 547 L397 497 C397 472 417 453 441 453 Z"/></svg></div>
      <div>
        <h1 class="brand-name">the cr<b>IB</b></h1>
        <span class="brand-tag">Your one-stop study hub<span id="sub-due"></span></span>
      </div>
      <div class="spacer"></div>
      <span id="sync-status"></span>
      <button class="icon-btn" id="themeBtn" title="Toggle night mode" aria-label="Toggle night mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings" aria-pressed="false"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
    <nav role="tablist" id="mainnav" aria-label="Main">
      <button role="tab" data-view="home" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
      <button role="tab" data-view="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M19 19v2H6"/></svg>Learn</button>
      <button role="tab" data-view="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Practice</button>
      <button role="tab" data-view="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
      <button role="tab" data-view="map" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
      <button role="tab" data-view="stories" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h12l4 4v12H4z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>Stories</button>
    </nav>
  </header>
  <div id="boot-msg" hidden>Loading your progress…</div>
  <main>
    <div id="practice-bar" class="subnav" role="tablist" aria-label="Practice" hidden>
      <button role="tab" data-sub="practice">Overview</button>
      <button role="tab" data-sub="drill">Drill</button>
      <button role="tab" data-sub="quiz">Quiz</button>
      <button role="tab" data-sub="labs">Labs</button>
      <button role="tab" data-sub="topics">Topics</button>
    </div>
    <section class="view" id="view-home"></section>
    <section class="view" id="view-practice" hidden></section>
    <section class="view" id="view-learn" hidden></section>
    <section class="view" id="view-topics" hidden></section>
    <section class="view" id="view-acct" hidden></section>
    <section class="view" id="view-drill" hidden></section>
    <section class="view" id="view-quiz" hidden></section>
    <section class="view" id="view-labs" hidden></section>
    <section class="view" id="view-map" hidden></section>
    <section class="view" id="view-stories" hidden></section>
    <section class="view" id="view-dash" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>
  <footer id="app-footer" class="muted" style="margin-top:34px;font-size:11px;text-align:center;font-family:var(--mono);letter-spacing:.02em"></footer>
</div>
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>

<script src="data/lbo.js"></script>
<script src="data/mna.js"></script>
<script src="data/valuation.js"></script>
<script src="js/build-data.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
